name: Build Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./core/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/qq-farm-bot:latest
            ghcr.io/${{ github.repository_owner }}/qq-farm-bot:${{ github.sha }}
          build-args: |
            NODE_IMAGE=node:20.19.6-alpine3.21
            PNPM_VERSION=10.30.2
            NPM_REGISTRY=https://registry.npmjs.org/
